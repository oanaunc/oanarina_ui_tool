name: Editor source checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      build_mac:
        description: Build an unsigned Mac development app and refresh bundled resources
        type: boolean
        required: false
        default: false
jobs:
  editor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run mcp:install
      - run: npm test
      - run: npx tsc --noEmit
      - run: npm run mcp:check
      # Source validation does not regenerate the frozen release archives.
      - run: node scripts/test-mcp-source.mjs
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: editor-test-results
          path: test-results
  mac:
    if: github.event_name == 'workflow_dispatch' && inputs.build_mac
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run mcp:install
      - run: npm run build:mac
      - run: npm run mcp:test
      - run: ditto -c -k --keepParent "build/Forma.app" build/Forma-development.zip
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-universal-mac-preview
          path: build/Forma-development.zip
