name: Editor and native Mac build
on:
  push:
    branches: [main]
  pull_request:
jobs:
  editor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: editor-screenshots
          path: build/screenshots
  mac:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build:mac
      - run: ditto -c -k --keepParent "build/Oanarina UI Tool.app" build/Oanarina-UI-Tool-development.zip
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-universal-mac-preview
          path: build/Oanarina-UI-Tool-development.zip
